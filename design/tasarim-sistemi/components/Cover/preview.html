<!-- @dsCard height=288 -->
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Çember</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;800&display=swap">
<style>
  html,body{margin:0;height:100%}
  body{background:var(--zemin);color:var(--ana-koyu);font-family:var(--font-sans);overflow:hidden}
  .cover{position:relative;height:288px;overflow:hidden}
  .art{position:absolute;top:0;left:480px;width:480px;height:288px;overflow:hidden}
  .art svg{display:block;width:480px;height:288px}
  .vurgu{fill:var(--vurgu)} .ana{fill:var(--ana)} .panel{fill:var(--panel-koyu-1)} .sari{fill:var(--forma-sari)}
  .blk{rx:var(--radius-xl)} .hap{rx:var(--radius-snack)}
  .halka{fill:none;stroke-width:6px}
  .halka.v{stroke:var(--vurgu)} .halka.z{stroke:var(--vurgu-zemin)}
  .words{position:absolute;left:32px;bottom:32px;max-width:440px}
  .name{margin:0;font-size:120px;line-height:.92;font-weight:800;letter-spacing:-.03em;color:var(--ana-koyu)}
  .tag{margin:12px 0 0 4px;font-size:14px;line-height:20px;color:var(--metin-ikincil)}
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      vurgu 176×256 bled off the top (the brand's one action colour, largest) · ana 128×176 · panel-koyu-1 144×280 bleeding off the right and bottom (the scoreboard world) · forma-sari 64×20 pill once (team colours) — ≈36% of 960×288
  arrangement one tall turquoise slab, a charcoal satellite, the dark scoreboard slab on the edge; bottoms of the first two on one line space-8 above the edge, space-4 gutters
  pattern     rings (literal motif): the name means "hoop" and the logo is interlocking hoops, so a few 6px hoops — two cut into the slab in vurgu-zemin, two on the dark slab in vurgu, one crossing the gutter
  scales      sides in space-4 multiples; gutters space-4; corners radius-xl, pill rx radius-snack (half of 20)
-->
<rect class="vurgu blk" x="16" y="-16" width="176" height="256" rx="16"/>
<rect class="ana blk" x="208" y="64" width="128" height="176" rx="16"/>
<rect class="panel blk" x="352" y="24" width="144" height="280" rx="16"/>
<rect class="sari hap" x="208" y="256" width="64" height="20" rx="10"/>
<circle class="halka z" cx="104" cy="104" r="48"/>
<circle class="halka z" cx="104" cy="104" r="24"/>
<circle class="halka v" cx="424" cy="144" r="44"/>
<circle class="halka v" cx="424" cy="144" r="20"/>
<circle class="halka z" cx="272" cy="152" r="32"/>
</svg>
</div>
<div class="words">
<h1 class="name">Çember</h1>
<p class="tag">Beden eğitimi öğretmeninin sınıf yardımcısı: yoklama, takım, skor.</p>
</div>
</div>
</body>
</html>
