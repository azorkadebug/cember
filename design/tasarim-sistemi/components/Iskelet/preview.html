<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Iskelet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
<style>body{margin:0}</style></head>
<body>
<div class="cm cm-gri" style="padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px" aria-busy="true" aria-label="Yükleniyor">
<div style="display:flex;flex-direction:column;gap:12px">
<div class="cm-isk-sinif"><i class="cm-isk" style="width:52px;height:52px;border-radius:var(--radius-lg)"></i><div style="flex:1;display:flex;flex-direction:column;gap:8px"><i class="cm-isk" style="width:45%;height:16px"></i><i class="cm-isk" style="width:30%;height:12px"></i></div></div>
<div class="cm-isk-sinif"><i class="cm-isk" style="width:52px;height:52px;border-radius:var(--radius-lg)"></i><div style="flex:1;display:flex;flex-direction:column;gap:8px"><i class="cm-isk" style="width:35%;height:16px"></i><i class="cm-isk" style="width:28%;height:12px"></i></div></div>
<div class="cm-isk-sinif"><i class="cm-isk" style="width:52px;height:52px;border-radius:var(--radius-lg)"></i><div style="flex:1;display:flex;flex-direction:column;gap:8px"><i class="cm-isk" style="width:50%;height:16px"></i><i class="cm-isk" style="width:25%;height:12px"></i></div></div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<div class="cm-isk-ogr"><i class="cm-isk" style="width:3.5px;height:44px;border-radius:2px"></i><div style="flex:1;display:flex;flex-direction:column;gap:7px"><i class="cm-isk" style="width:55%;height:14px"></i><i class="cm-isk" style="width:35%;height:11px"></i></div><i class="cm-isk" style="width:32px;height:32px;border-radius:var(--radius-sm)"></i></div>
<div class="cm-isk-ogr"><i class="cm-isk" style="width:3.5px;height:44px;border-radius:2px"></i><div style="flex:1;display:flex;flex-direction:column;gap:7px"><i class="cm-isk" style="width:42%;height:14px"></i><i class="cm-isk" style="width:30%;height:11px"></i></div><i class="cm-isk" style="width:32px;height:32px;border-radius:var(--radius-sm)"></i></div>
<div class="cm-isk-ogr"><i class="cm-isk" style="width:3.5px;height:44px;border-radius:2px"></i><div style="flex:1;display:flex;flex-direction:column;gap:7px"><i class="cm-isk" style="width:60%;height:14px"></i><i class="cm-isk" style="width:25%;height:11px"></i></div><i class="cm-isk" style="width:32px;height:32px;border-radius:var(--radius-sm)"></i></div>
<div class="cm-isk-ogr"><i class="cm-isk" style="width:3.5px;height:44px;border-radius:2px"></i><div style="flex:1;display:flex;flex-direction:column;gap:7px"><i class="cm-isk" style="width:48%;height:14px"></i><i class="cm-isk" style="width:33%;height:11px"></i></div><i class="cm-isk" style="width:32px;height:32px;border-radius:var(--radius-sm)"></i></div>
</div>
</div>
</body>
</html>
