<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sınıflarım</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0&amp;display=swap">
<style>
body{margin:0}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-variation-settings:"FILL" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Roboto, system-ui, sans-serif; background: {{c.sayfa}}; color: {{c.metin}}; display: flex; flex-direction: column">
  <div style="background: {{c.bar}}; color: {{c.barMetin}}; height: 56px; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 4px; flex: none">
    <div style="font-size: 20px; font-weight: 800; flex-grow: 1">Sınıflarım</div>
    <button aria-label="Öğrenci ara" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.barMetin}}; display: grid; place-items: center"><span class="ms" style="font-size: 24px">person_search</span></button>
    <button aria-label="Yardım" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.barMetin}}; display: grid; place-items: center"><span class="ms" style="font-size: 24px">help</span></button>
    <button aria-label="Profil" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.barMetin}}; display: grid; place-items: center"><span class="ms" style="font-size: 24px">person</span></button>
  </div>
  <div style="background: {{c.basGradyan}}; border-radius: 0 0 20px 20px; padding: 0 20px 14px; color: {{c.barMetin}}; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex: none">
    <span class="ms" style="font-size: 18px; opacity: .86">waving_hand</span><span style="opacity: .86">ogretmen@okul.k12.tr</span>
  </div>

  <div style="margin: 16px 16px 8px; background: {{c.bant}}; border-radius: 12px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #ffffff; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px {{c.golge}}; border: 1px solid {{c.bantCizgi}}">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #4caf50; flex: none"></span>
    <span style="flex-grow: 1">Etkinlik devam ediyor</span>
    <button aria-label="Duraklat" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: rgba(255,152,0,.16); color: #ff9800; display: grid; place-items: center"><span class="ms" style="font-size: 24px">pause</span></button>
    <button aria-label="Bitir" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: rgba(244,67,54,.16); color: #e57373; display: grid; place-items: center"><span class="ms" style="font-size: 24px">stop</span></button>
  </div>

  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{siniflar}}" as="s" hint-placeholder-count="5">
      <div style="background: {{c.kart}}; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 6px {{c.golge}}; border: 1px solid {{c.kartCizgi}}">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: {{s.gradyan}}; display: grid; place-items: center; color: #ffffff; flex: none"><span class="ms" style="font-size: 28px">groups</span></div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 18px; font-weight: 700; color: {{c.metin}}">{{s.ad}}</div>
          <div style="font-size: 13px; margin-top: 4px; color: {{s.altRenk}}; font-weight: {{s.altKalin}}">{{s.alt}}</div>
        </div>
        <span class="ms" style="font-size: 24px; color: {{c.ok}}">chevron_right</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; right: 16px; bottom: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px">
    <button aria-label="Yarışma" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid {{c.fabKucukCizgi}}; background: {{c.fabKucuk}}; color: #ffffff; display: grid; place-items: center; box-shadow: 0 3px 6px rgba(0,0,0,.25)"><span class="ms" style="font-size: 22px">emoji_events</span></button>
    <button style="height: 56px; border-radius: 16px; border: 0; background: {{c.vurgu}}; color: {{c.vurguMetin}}; padding: 0 20px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; box-shadow: 0 3px 8px rgba(0,0,0,.3)"><span class="ms" style="font-size: 24px">add</span>Sınıf Ekle</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["acik","lacivert","charcoal"],"default":"acik"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      acik: { sayfa: '#f5f5f5', kart: '#ffffff', kartCizgi: 'transparent', metin: '#263238', ikincil: '#5a6870', uyari: '#8a5300', ok: '#bdbdbd',
        bar: '#37474f', barMetin: '#ffffff', basGradyan: 'linear-gradient(180deg,#37474f,#546e7a)', bant: 'linear-gradient(90deg,#1a1a2e,#16213e)', bantCizgi: 'transparent',
        golge: 'rgba(0,0,0,.08)', vurgu: '#00897b', vurguMetin: '#ffffff', fabKucuk: '#1a1a2e', fabKucukCizgi: 'transparent' },
      lacivert: { sayfa: '#1a1a2e', kart: '#16213e', kartCizgi: 'rgba(255,255,255,.06)', metin: '#eef1f7', ikincil: '#a9b3c7', uyari: '#ffb74d', ok: '#5c6784',
        bar: '#121225', barMetin: '#eef1f7', basGradyan: 'linear-gradient(180deg,#121225,#1f2747)', bant: 'linear-gradient(90deg,#0f3a36,#11303f)', bantCizgi: 'rgba(77,182,172,.35)',
        golge: 'rgba(0,0,0,.35)', vurgu: '#4db6ac', vurguMetin: '#062925', fabKucuk: '#24305a', fabKucukCizgi: 'rgba(255,255,255,.12)' },
      charcoal: { sayfa: '#111517', kart: '#1c2327', kartCizgi: 'rgba(255,255,255,.05)', metin: '#eceff1', ikincil: '#a7b4bb', uyari: '#ffb74d', ok: '#56646b',
        bar: '#1c2327', barMetin: '#eceff1', basGradyan: 'linear-gradient(180deg,#1c2327,#263238)', bant: 'linear-gradient(90deg,#1a1a2e,#16213e)', bantCizgi: 'rgba(255,255,255,.1)',
        golge: 'rgba(0,0,0,.4)', vurgu: '#4db6ac', vurguMetin: '#062925', fabKucuk: '#263238', fabKucukCizgi: 'rgba(255,255,255,.12)' }
    };
    var c = P[this.props.tema] || P.acik;
    var veri = [
      { ad: '7-A', alt: '24 öğrenci', g: 'linear-gradient(135deg,#4a90e2,#50c9c3)' },
      { ad: '7-B', alt: '23 öğrenci', g: 'linear-gradient(135deg,#e94b6a,#ff6b35)' },
      { ad: '8/B', alt: '22 öğrenci', g: 'linear-gradient(135deg,#26a69a,#4db6ac)' },
      { ad: '6-C', alt: '25 öğrenci', g: 'linear-gradient(135deg,#9b59b6,#d16ba5)' },
      { ad: '5-C', alt: 'Öğrenci ekle', g: 'linear-gradient(135deg,#5c6bc0,#7986cb)', bos: true }
    ];
    return {
      c: c,
      siniflar: veri.map(function (s) {
        return { ad: s.ad, alt: s.alt, gradyan: s.g, altRenk: s.bos ? c.uyari : c.ikincil, altKalin: s.bos ? 600 : 400 };
      })
    };
  }
}
</script>
</body>
</html>
