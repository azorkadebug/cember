<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Flutter bu satırı yüklenince ekliyor; baştan olmayınca telefonda
       açılış ekranı önce masaüstü genişliğinde (küçük) çizilip sonra
       birden büyüyordu (2026-10-05). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Çember - Sınıf Yönetimi Asistanı">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Ana ekrandan açılınca iPhone durum çubuğu (saat/pil) bu renkte;
       sonradan JS ile değişmiyor, o yüzden telefonun açık/koyu moduna göre
       baştan iki renk (2026-10-05: koyu temada üstte krem şerit kalıyordu). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF6EA">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171A21">
  <meta name="apple-mobile-web-app-title" content="Çember">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3"/>
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>Çember</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- main.dart.js inene kadar sayfa bembeyazdı; markalı bekleme ekranı
       splash.js ile kaldırılıyor (denetim D7). Satır içi <script> KULLANMA:
       firebase.json'daki CSP engeller. -->
  <style>
    /* Safari'nin alt çubuğunun arkası sayfa zemini; tanımsızken beyazdı.
       Uygulama açılınca temaya göre splash.js cemberZemin ile güncellenir. */
    html,body{background:#FFF6EA}
    @media (prefers-color-scheme: dark){
      html,body{background:#171A21}
      #cember-splash{background:#171A21!important;color:#F4F1EA!important}
      #cember-splash span{color:#B4B8C4!important}
      #cember-splash i{background:#F4F1EA!important}
    }
    #cember-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;background:#FFF6EA;color:#1F2430;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;z-index:9999;
      transition:opacity .25s ease .18s}
    /* Çıkış iki adım: önce logo ve yazı küçülüp kaybolur, sonra zemin
       söner — logo alttaki ekranla üst üste binip "hayalet" gibi
       görünmesin (2026-10-05). */
    #cember-splash .icerik{display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .18s ease,transform .18s ease}
    #cember-splash.cikis .icerik{opacity:0;transform:scale(.85)}
    /* Logo top gibi zıplar, altındaki gölge yere değdikçe büyür. */
    #cember-splash .top{display:flex;flex-direction:column;align-items:center}
    #cember-splash img{width:104px;height:104px;transform-origin:50% 100%;animation:zipla 1.1s cubic-bezier(.45,0,.55,1) infinite}
    #cember-splash i{display:block;width:76px;height:12px;margin-top:6px;border-radius:50%;background:#1F2430;opacity:.16;
      animation:golge 1.1s cubic-bezier(.45,0,.55,1) infinite}
    @keyframes zipla{
      0%,100%{transform:translateY(0) scale(1.08,.92)}
      12%{transform:translateY(-6px) scale(.96,1.04)}
      50%{transform:translateY(-38px) rotate(10deg) scale(1)}
      88%{transform:translateY(-6px) scale(.97,1.03)}}
    @keyframes golge{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(.55);opacity:.08}}
    @media (prefers-reduced-motion:reduce){#cember-splash img,#cember-splash i{animation:none}}
    #cember-splash b{font-size:28px;font-weight:800}
    #cember-splash span{font-size:14px;font-weight:600;color:#4A5060}
  </style>
  <div id="cember-splash" role="status" aria-live="polite">
    <div class="icerik">
      <div class="top"><img src="favicon.svg?v=3" alt=""><i></i></div>
      <b>Çember</b>
      <span>Yükleniyor…</span>
    </div>
  </div>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
