<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Çember - Sınıf Yönetimi Asistanı">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFF6EA">
  <meta name="apple-mobile-web-app-title" content="Çember">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3"/>
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>Çember</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- main.dart.js inene kadar sayfa bembeyazdı; markalı bekleme ekranı
       splash.js ile kaldırılıyor (denetim D7). Satır içi <script> KULLANMA:
       firebase.json'daki CSP engeller. -->
  <style>
    #cember-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;background:#FFF6EA;color:#1F2430;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;z-index:9999;
      transition:opacity .3s}
    #cember-splash img{width:104px;height:104px}
    #cember-splash b{font-size:28px;font-weight:800}
    #cember-splash span{font-size:14px;font-weight:600;color:#4A5060}
  </style>
  <div id="cember-splash" role="status" aria-live="polite">
    <img src="favicon.svg?v=3" alt="">
    <b>Çember</b>
    <span>Yükleniyor…</span>
  </div>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
