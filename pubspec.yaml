name: cember
description: "Takim Yonetim Asistani"
publish_to: 'none'
version: 1.1.1+11

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  # Apple Sign-In nonce'unun SHA-256'sı için (replay koruması).
  crypto: ^3.0.6
  # Yalnızca ESKİ (sifrelendi:true) kayıtları çözmek için tutuluyor.
  # Yeni yazmalar düz metin — bkz. sifreleme_service.dart.
  encrypt: ^5.0.3
  firebase_analytics: ^12.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Derleme zamanı aracı — üretim bağımlılık ağacına girmemeli.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Uygulama içi resimleri buradan tanıtıyoruz
  assets:
    - assets/images/logo.png

# Telefon ikonu için ayarlarımız burada durmaya devam etsin
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ic_foreground.png"