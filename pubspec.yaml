name: cember
description: "Takim Yonetim Asistani"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Uygulama içi resimleri buradan tanıtıyoruz
  assets:
    - assets/images/logo.png

# Telefon ikonu için ayarlarımız burada durmaya devam etsin
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: false
  ios: true